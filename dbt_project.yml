
name: 'ucv'
version: '1.0.0'
config-version: 2

profile: 'ucv'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"


models:
  ucv:
    staging:
      +catalog: workspace
      +schema: silver
      +materialized: view

    intermediate:
      +catalog: workspace
      +schema: silver
      +materialized: view

    marts:
      +catalog: workspace
      +schema: gold
      +materialized: table
