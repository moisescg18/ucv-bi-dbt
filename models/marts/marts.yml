version: 2

models:
  - name: dim_product
    columns:
      - name: product_key
        data_tests:
          - not_null
          - unique

  - name: dim_customer
    columns:
      - name: customer_key
        data_tests:
          - not_null
          - unique

  - name: dim_store
    columns:
      - name: store_key
        data_tests:
          - not_null
          - unique

  - name: fact_sales
    columns:
      - name: sale_id
        data_tests:
          - not_null
          - unique
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key